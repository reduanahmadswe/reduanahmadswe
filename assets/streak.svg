<svg xmlns="http://www.w3.org/2000/svg" width="590" height="190" viewBox="0 0 590 190">
<style>@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.9}}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1s ease-out both}.gl{animation:glow 4s ease-in-out infinite}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset=".55" stop-color="#101a33"/><stop offset="1" stop-color="#0a1626"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#00d9ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="o" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00d9ff" stop-opacity=".22"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="588" height="188" rx="22" fill="url(#bg)" stroke="#1e2a44" stroke-width="2"/>
<circle cx="530" cy="30" r="150" fill="url(#o)" class="gl"/>
<text x="32" y="46" font-size="19" font-weight="800" fill="#fff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Contribution Streak</text><text x="32" y="68" font-size="12" fill="#8fa3b8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">days with at least one contribution</text><g><text x="112" y="115" text-anchor="middle" font-size="40" font-weight="800" fill="#fff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">1911</text><text x="112" y="142" text-anchor="middle" font-size="12.5" fill="#a78bfa" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600">Total</text></g><g><text x="287" y="115" text-anchor="middle" font-size="40" font-weight="800" fill="#fff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">7</text><text x="287" y="142" text-anchor="middle" font-size="12.5" fill="#00d9ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600">Current streak</text></g><rect x="200" y="82" width="1.5" height="70" fill="#1e2a44"/><g><text x="462" y="115" text-anchor="middle" font-size="40" font-weight="800" fill="#fff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">19</text><text x="462" y="142" text-anchor="middle" font-size="12.5" fill="#a78bfa" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600">Longest streak</text></g><rect x="375" y="82" width="1.5" height="70" fill="#1e2a44"/><circle cx="287" cy="115" r="62" fill="none" stroke="url(#ac)" stroke-width="3" stroke-dasharray="6 8" opacity=".5"/></svg>