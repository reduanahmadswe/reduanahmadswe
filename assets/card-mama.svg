<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230">
<style>
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes tilt{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes grid{from{stroke-dashoffset:0}to{stroke-dashoffset:-28}}
.float{animation:fl 4s ease-in-out infinite}
.tilt{animation:tilt 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glow{animation:glow 3s ease-in-out infinite}
.gl{animation:grid 1.5s linear infinite}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset=".5" stop-color="#101a33"/><stop offset="1" stop-color="#0a1626"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fe9ff"/></linearGradient>
<linearGradient id="face2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d9ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="orb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00d9ff" stop-opacity=".35"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity=".6"/></filter>
</defs>
<rect x="14" y="14" width="532" height="202" rx="22" fill="#047857" opacity=".6" transform="translate(10 12)"/>
<rect x="14" y="14" width="532" height="202" rx="22" fill="#10b981" opacity=".7" transform="translate(5 6)"/>
<rect x="14" y="14" width="532" height="202" rx="22" fill="url(#bg)" stroke="#9affc2" stroke-opacity=".6" stroke-width="1.5"/>
<circle cx="460" cy="90" r="90" fill="#9affc2" opacity=".1" class="glow"/>
<g class="float" style="animation-delay:0.0s;animation-duration:4s"><polygon points="460,54 491.32,72.0 460,90.0 428.68,72.0" fill="#9affc2"/><polygon points="428.68,72.0 460,90.0 460,126 428.68,108.0" fill="#10b981"/><polygon points="491.32,72.0 460,90.0 460,126 491.32,108.0" fill="#047857"/></g>
<text x="40" y="76" font-size="30" font-weight="900" fill="#ffffff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Mama Bazar</text>
<text x="40" y="112" font-size="15" fill="#9fb3c8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Online grocery &amp; lifestyle store</text>
<text x="40" y="136" font-size="15" fill="#9fb3c8" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">delivering essentials across Bangladesh</text>
<rect x="40" y="172" width="104" height="28" rx="14" fill="#10b981" opacity=".3"/><text x="92.0" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="#9affc2" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">E-commerce</text><rect x="154" y="172" width="104" height="28" rx="14" fill="#10b981" opacity=".3"/><text x="206.0" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="#9affc2" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Full-Stack</text>
